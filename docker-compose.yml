services:
  db:
    image: postgres:17
    container_name: parvaordo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parvaordo
    ports:
      - "5432:5432"
    volumes:
      - parvaordo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parvaordo"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Out-of-band video clip cutter (ffmpeg). Local equivalent of the prod
  # Cloudflare Container. The Next app posts jobs to http://localhost:8080/cut;
  # the cutter calls back to APP_URL (host.docker.internal:3000) when done.
  clip-cutter:
    build: ./infra/workers/clip-cutter
    container_name: parvaordo_clip_cutter
    ports:
      - "8080:8080"
    environment:
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID}
      BUNNY_STREAM_LIBRARY_KEY: ${BUNNY_STREAM_LIBRARY_KEY}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME}
      CLIP_CALLBACK_SECRET: ${CLIP_CALLBACK_SECRET}
      PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  parvaordo_pgdata:
